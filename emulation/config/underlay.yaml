version: 2

topology:
  name: sndlib-abilene
  format: sndlib_xml
  path: emulation/runtime/datasets/abilene.xml
  canonical_url: https://sndlib.put.poznan.pl/abilene.overview.action
  source_url: https://sndlib.put.poznan.pl/download/sndlib-networks-xml/abilene.xml
  sha256: a5793e17bb72ff13fed5e7d80e9a46c6af2041c4cc2e6381906bd06da8936fe3
  provenance: SNDlib
  source_note: "Abilene scaled directed peak instance; physical links treated as bidirected"
  expected_unit: MBITPERSEC
  link_model: bidirected
  parallel_link_policy: preserve

traffic_matrix:
  path: emulation/runtime/datasets/demandMatrix-abilene-zhang-5min-20040301-0010.xml
  archive_url: https://sndlib.put.poznan.pl/download/directed-abilene-zhang-5min-over-6months-ALL.tgz
  archive_sha256: 74b144fd947a672ef49989de7bac028b02a96f39d17d4e3d5e61c862e9a48b30
  archive_member: directed-abilene-zhang-5min-over-6months-ALL/demandMatrix-abilene-zhang-5min-20040301-0010.xml
  sha256: c7fed774b61790a4c042fbd8034688a848028490391a83f3047b2c973a473438
  expected_time: "20040301-0010"
  expected_granularity: 5min
  expected_unit: MBITPERSEC
  provenance_readme:
    path: emulation/runtime/datasets/abilene-rm.txt
    source_url: https://sndlib.put.poznan.pl/download/abilene-rm.txt
    sha256: 2864b26d747126353a3378f771797695d22035fbdb296c03f48b2e6ee95ffd3a

profiles:
  mini:
    description: "Chuỗi Atlanta--Indianapolis--Chicago để kiểm tra forwarding"
    nodes: [ATLAng, IPLSng, CHINng]
  abilene:
    description: "Toàn bộ 12 router và 15 physical link của SNDlib Abilene"
    nodes:
      - ATLAM5
      - ATLAng
      - CHINng
      - DNVRng
      - HSTNng
      - IPLSng
      - KSCYng
      - LOSAng
      - NYCMng
      - SNVAng
      - STTLng
      - WASHng

addressing:
  point_to_point_pool: 10.64.0.0/16
  point_to_point_prefix: 30
  loopback_pool: 10.255.0.0/24
  loopback_prefix: 32

scaling:
  capacity_divisor: 100.0
  demand_divisor: 100.0
  policy: preserve_utilization

link_defaults:
  delay_model:
    type: geodesic_fiber_estimate
    stretch_factor: 2.1
    fiber_speed_km_s: 204000
  configured_random_loss_percent: 0
  max_queue_packets: 1000
  queue_profile: htb_netem_codel
  codel:
    target_ms: 5
    interval_ms: 100
    ecn: false

load_validation:
  offered_load_factors: [0.8, 1.0, 1.1]
  duration_seconds: 8
  settle_seconds: 2

traffic_generation:
  tool: D-ITG
  version: 2.8.1-r1023
  demand_selection_policy: maximum_scaled_demand_in_selected_profile
  source_url: https://traffic.comics.unina.it/software/ITG/codice/D-ITG-2.8.1-r1023-src.zip
  source_sha256: e3974b167a684110cacb0436193d5dabdfc90d2c8e1bb18838e20c75bd406ebf
  compatibility_patch: emulation/images/router/d-itg-gcc14.patch
  protocol: UDP
  packet_size_bytes: 1000
  duration_seconds: 5
  seed: 0.424242

routing:
  protocol: ospf
  area: 0.0.0.0
  hello_interval_seconds: 1
  dead_interval_seconds: 4
  convergence_timeout_seconds: 40

container:
  image: zt-sdwan-router:local
  command: /usr/local/bin/start-router
  capabilities: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv4.conf.all.rp_filter: "0"
    net.ipv4.conf.default.rp_filter: "0"
